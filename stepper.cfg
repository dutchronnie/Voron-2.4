[stepper_x]
# motor: ldo-42sth48-2004mah
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40 #39.32 #40
microsteps: 64
full_steps_per_rotation: 400  #set to 200 for 1.8 degree stepper
endstop_pin: EBBCan:gpio24 #PG6
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
# motor: ldo-42sth48-2004mah
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40 #39.34 #40
microsteps: 64
full_steps_per_rotation: 400  #set to 200 for 1.8 degree stepper
endstop_pin: PG9
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Z Stepper - Front Left
##  Connected to MOTOR2_2
[stepper_z]
##  motor: ldo-42sth48-2004ac
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

endstop_pin: probe:z_virtual_endstop 
position_max: 260
position_min: -50 #-5
homing_speed: 25
second_homing_speed: 3
homing_retract_dist: 0 #was 3 zonder carthographer 

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
##  motor: ldo-42sth48-2004ac
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
##  motor: ldo-42sth48-2004ac
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
##  motor: ldo-42sth48-2004ac
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[extruder]
##  motor: ldo-36sth20-1004ahg
step_pin: EBBCan:gpio18 # step_pin: PE2
dir_pin: EBBCan:gpio19 # dir_pin: !PE3
enable_pin: !EBBCan:gpio17 # enable_pin: !PD4
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 48.02976      #Galileo 2 extruder
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
#gear_ratio: 50:10               #BMG Gear Ratio
gear_ratio: 9:1                  #Galileo 2 Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: EBBCan:gpio7 #heater_pin: PA2
pressure_advance: 0.05

## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
# sensor_pin: PF4 
# sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan:gpio27
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
max_extrude_cross_section: 5

max_extrude_only_distance: 120 # default is 50mm