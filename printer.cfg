# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# Voron Design VORON2 300mm BigTreeTech OctoPus V1 TMC2209 UART config

#  MCU for Octopus v1.0 controller
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_250004000650534841313020-if00
restart_method: command

#  MCU for SB2209 (RP2040)
[mcu EBBCan]
canbus_uuid: b01c16787238 

#  MCU for adxl345 acelometer
# [mcu rpi]
# serial: /tmp/klipper_host_mcu

#  General Printer definition
[printer]
kinematics: corexy
max_velocity: 375 
max_accel: 10000            # Aangepast van 23000 voor veiligheid en printkwaliteit
max_z_velocity: 20          # Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[mcu scanner]
canbus_uuid: 126dac49430c

[scanner]
mcu: scanner            
x_offset: 0                          
y_offset: 26                         
backlash_comp: 0.00359 
sensor: cartographer
sensor_alt: carto       
mesh_runs: 2

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

[include timelapse.cfg]
[include stepper.cfg]
[include tmc.cfg]
[include shell_command.cfg]
#[include filament_sensor.cfg]
[include mainsail.cfg]
[include stealthburner_led_effects.cfg]
[include adxl.cfg]
[include macros.cfg]
[include KAMP_Settings.cfg]
[include nozzle-scrub.cfg]
[include caselight.cfg]
[include fan.cfg]
[include part-cooling.cfg]
[include ShakeTune.cfg]
[include config_backup.cfg]
[include input-shaper.cfg]
[include TEST_SPEED.cfg]
#[include filament_sensor.cfg]


# [save_variables]
# filename:~/variables.cfg

# Enable object exclusion
[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[pause_resume]

[auto_speed]
settling_home: 1        # Perform settling home before starting Auto Speed

#[skew_correction]


#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 120

#####################################################################
#   Firmware Retraction
#####################################################################
[firmware_retraction]
retract_length: 1.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

#####################################################################
#   Additional Sensors
#####################################################################
[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor toolhead]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF4

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
timeout: 1800

[safe_z_home]
home_xy_position: 150,150
z_hop: 10

[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
points:
   15,30
   15,240
   275,240
   275,30
speed: 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

########################################
# EXP1 / EXP2 (display) pins
########################################
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

#################################################
# bed_mesh settings voor de cartographer probe
#################################################
[bed_mesh]
zero_reference_position: 150, 150    
speed: 400                  # Snelheid verhoogd voor sneller scannen
horizontal_move_z: 5
mesh_min: 15, 41
mesh_max: 275, 270          # Bereik op de Y-as geoptimaliseerd
probe_count: 30, 30
algorithm: bicubic

