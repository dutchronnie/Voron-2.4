##################################################################################################################################################
####    CHANGE NOZZLE PARK
################################################################################################################################################## 
[gcode_macro CLEAN_NOZZLE_PARK]
gcode:
 _CG28
 G90
 G1 X30 Y300 Z5 F6000

##################################################################################################
# Clean_nozzle: cleans the nozzle by moving over the brush and extrude
##################################################################################################

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 28
variable_start_x_p: 28
variable_start_y: 299
variable_start_z: 3.0
variable_wipe_dist: 30
variable_wipe_y_dist: 3.5    # NIEUW: Hoeveel mm hij naar voren beweegt over de borstel
variable_wipe_qty: 6         # Teruggezet naar 6, want elke cyclus heeft nu 4 veegbewegingen!
variable_wipe_spd: 200
variable_raise_distance: 20

gcode:
  STATUS_CLEANING
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  ## Absolute positioning
  G90
  ## Move nozzle to purge position
  G1 X{start_x - 18} Y{start_y} F6000
  
  ## Extrude a little
  M83
  G1 E10 F300
  # Wait 1sec to let it stabilize
  G4 P1000
  
  ## Krachtige retract om de drukdraad direct te breken
  G1 E-3.5 F400

  ## Lower nozzle onto the brush
  G1 Z{start_z} F1500

  ## Move nozzle to start position
  G1 X{start_x} Y{start_y} F6000

  ## Wipe nozzle (De nieuwe zigzag slinger-beweging!)
  {% for wipes in range(1, (wipe_qty + 1)) %}
    # 1. Diagonaal naar rechts en naar voren schuren
    G1 X{start_x + wipe_dist} Y{start_y - wipe_y_dist} F{wipe_spd * 60}
    # 2. Diagonaal naar links en weer naar achteren (terug naar start_y)
    G1 X{start_x} Y{start_y} F{wipe_spd * 60}
    # 3. Recht naar rechts over het midden van de borstel
    G1 X{start_x + wipe_dist} Y{start_y - (wipe_y_dist / 2)} F{wipe_spd * 60}
    # 4. Recht naar links over het midden van de borstel
    G1 X{start_x} Y{start_y - (wipe_y_dist / 2)} F{wipe_spd * 60}
  {% endfor %}

  ## Tweede anti-ooze retract vlak voor het verlaten van de borstel
  G1 E-1.5 F400

  ## Korte, dwarse extra veeg om de punt definitief brandschoon te draaien
  G1 X{start_x + wipe_dist} Y{start_y} F{wipe_spd * 60}
  G1 X{start_x} Y{start_y - wipe_y_dist} F{wipe_spd * 60}
  
  ## Even een seconde wachten zodat de restdruk absoluut nul is
  G4 P1000

  ## Raise nozzle
  G1 Z{raise_distance}
  
  ## Nozzle in the middle of the bed
  G1 X{150} Y{150} F{wipe_spd * 30}
  STATUS_READY
  

##################################################################################################################################################
####    CONDITIONNAL HOMMING
##################################################################################################################################################
[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        SET_LED_EFFECT EFFECT=homing REPLACE=1
        G28
        SET_LED_EFFECT EFFECT=classic REPLACE=1
    {% endif %}