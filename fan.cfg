#####################################################################
#   Fan Control
#####################################################################

##  Part Cooling Fan - FAN0
[fan]
pin: EBBCan:gpio13 #pin: PA8
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

##  Hotend Fan - FAN1
[heater_fan Hotend_fan]
pin: EBBCan:gpio14 #pin: PE5
max_power: 1.0
fan_speed: 1
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

#  Controller fan - FAN2
[controller_fan Electronics_fan's]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
fan_speed: 1.0

