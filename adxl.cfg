#####################################################################
#  resonance tester definition
#####################################################################

[resonance_tester]
accel_chip: adxl345
probe_points:
     150, 150, 20  
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0


# # Shell Comand is not supported by a default klipper installation

[gcode_shell_command plot_graph]
command: bash /home/voron/klipper_config/script/plot_graph.sh
timeout: 60.0
verbose: True
  