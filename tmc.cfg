#####################################################################
#   TMC Autotune
#   https://github.com/andrewmcgr/klipper_tmc_autotune
#####################################################################

[autotune_tmc stepper_x]
motor: ldo-42sth48-2004mah
tuning_goal=performance

[autotune_tmc stepper_y]
motor: ldo-42sth48-2004mah
tuning_goal=performance

[autotune_tmc stepper_z]
motor: ldo-42sth48-2004ac
tuning_goal=auto

[autotune_tmc stepper_z1]
motor: ldo-42sth48-2004ac
tuning_goal=auto

[autotune_tmc stepper_z2]
motor: ldo-42sth48-2004ac
tuning_goal=auto

[autotune_tmc stepper_z3]
motor: ldo-42sth48-2004ac
tuning_goal=auto

[autotune_tmc extruder]
motor: 36h020h-1004a-001
tuning_goal=auto

[motor_constants 36h020h-1004a-001]
resistance: 2.37
inductance: 0.0012
holding_torque: 0.08825985
max_current: 1.00
steps_per_revolution: 200

#####################################################################
#  TMC Definitions of all steppers
#####################################################################

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0.1

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0.1
 
[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: EBBCan:gpio20 
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0